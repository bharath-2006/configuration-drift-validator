version: '3.8'

services:
  drift-validator:
    image: python:3.11-slim
    container_name: config-drift-validator
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
