name: Automated Pytest & Configuration Drift Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Run Pytest and Drift Safety Gate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run pytest
        run: |
          python -m pytest -v

      - name: 5. Run configuration validation
        run: |
          python -m backend.ci_validator --env production

      - name: 6. Fail workflow when tests or drift validation fails
        if: failure()
        run: |
          echo "Workflow failed: tests or configuration validation detected blocking issues."
          exit 1
